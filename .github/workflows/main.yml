name: Build Xiaomi 11T Pro Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev clang llvm make zip libncurses5-dev python3 git ccache

    - name: Fetch Toolchain (Proton Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

    - name: Compile Kernel
      run: |
        export PATH="$HOME/proton-clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        make O=out vili_defconfig
        make -j$(nproc) O=out

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vili-kernel-output
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtbo.img
          out/arch/arm64/boot/dtb*
